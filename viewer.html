<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alt Hip Hop History Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
}

/* ── Input page ─────────────────────────────────────────── */
#input-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 1rem;
}

#input-view h1 { font-size: 2rem; color: #e94560; }
#input-view p  { color: #888; font-size: 0.9rem; }

#paste-area {
    width: 100%;
    max-width: 820px;
    height: 320px;
    padding: 1rem;
    background: #16213e;
    color: #e0e0e0;
    border: 1px solid #333;
    border-radius: 10px;
    font-family: monospace;
    font-size: 0.8rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
}
#paste-area:focus { border-color: #e94560; }

#view-btn {
    padding: 0.75rem 2.5rem;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
}
#view-btn:hover { background: #c73652; }

/* ── Slideshow ───────────────────────────────────────────── */
#slideshow-view {
    display: none;
    flex-direction: column;
    height: 100vh;
}

#nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1.25rem;
    background: #16213e;
    border-bottom: 2px solid #e94560;
    flex-shrink: 0;
}

.nav-btn {
    padding: 0.4rem 1.1rem;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
}
.nav-btn:hover:not(:disabled) { background: #c73652; }
.nav-btn:disabled { background: #333; color: #666; cursor: default; }

#back-btn {
    padding: 0.4rem 1rem;
    background: transparent;
    color: #888;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
}
#back-btn:hover { color: #ccc; border-color: #666; }

#slide-counter { color: #888; font-size: 0.85rem; }

#slide-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto;
    gap: 1rem;
    align-content: start;
}

/* ── Album header ────────────────────────────────────────── */
#album-header {
    grid-column: 1 / -1;
    background: #16213e;
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    border-left: 4px solid #e94560;
}

#album-header h1 {
    font-size: 1.6rem;
    color: #fff;
    line-height: 1.2;
}

.album-meta {
    color: #888;
    font-size: 0.85rem;
    margin-top: 0.3rem;
}

.artist-chips { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }

.chip {
    background: #0f3460;
    border-radius: 6px;
    padding: 0.3rem 0.65rem;
    font-size: 0.78rem;
    line-height: 1.4;
}
.chip-name  { font-weight: 700; color: #e94560; }
.chip-meta  { color: #aaa; }

/* ── Generic section ─────────────────────────────────────── */
.section {
    background: #16213e;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    overflow: hidden;
}

.scrollable {
    display: flex;
    flex-direction: column;
}
.scrollable .scroll-body {
    overflow-y: auto;
    max-height: 400px;
    padding-right: 0.25rem;
}
.scrollable .scroll-body::-webkit-scrollbar { width: 5px; }
.scrollable .scroll-body::-webkit-scrollbar-track { background: transparent; }
.scrollable .scroll-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.section-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #e94560;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #2a2a3e;
    margin-bottom: 0.6rem;
}

.sub-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #888;
    margin: 0.75rem 0 0.35rem;
}

.full-width { grid-column: 1 / -1; }

/* ── Album entries ───────────────────────────────────────── */
.entry {
    font-size: 0.78rem;
    color: #bbb;
    padding: 0.3rem 0;
    border-bottom: 1px solid #1e1e30;
    line-height: 1.5;
}
.entry:last-child { border-bottom: none; }

.entry-title  { color: #fff; font-weight: 600; }
.entry-collab { color: #e94560; }
.entry-meta   { color: #666; }
.entry-rank   { color: #e94560; font-weight: 700; min-width: 2em; display: inline-block; }

.none-msg { font-size: 0.78rem; color: #555; font-style: italic; }

/* ── Points ─────────────────────────────────────────────── */
.points-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0 1.5rem;
}

.points-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.78rem;
    color: #bbb;
    padding: 0.25rem 0;
    border-bottom: 1px solid #1e1e30;
}
.points-row:last-child { border-bottom: none; }
.points-val { color: #e94560; font-weight: 700; }
</style>
</head>
<body>

<!-- ── Input ──────────────────────────────────────────────── -->
<div id="input-view">
    <h1>Alt Hip Hop History Viewer</h1>
    <p>Paste the chronological list output below, then press View</p>
    <textarea id="paste-area" placeholder="1. Album Title (Artist Name, MBTI Ennea inst/inst t1 t2 t3, Region) [M/D/YYYY] {position}&#10;2. Group Album (Artist One, MBTI..., Region;; Artist Two, MBTI..., Region) [M/D/YYYY] {position}&#10;..."></textarea>
    <button id="view-btn" onclick="startViewer()">View Slideshow →</button>
</div>

<!-- ── Slideshow ──────────────────────────────────────────── -->
<div id="slideshow-view">
    <div id="nav-bar">
        <div style="display:flex;gap:0.5rem;align-items:center">
            <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Prev</button>
            <button id="back-btn" onclick="backToInput()">↩ Re-paste</button>
        </div>
        <span id="slide-counter"></span>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)">Next →</button>
    </div>
    <div id="slide-content"></div>
</div>

<script>
let albums = [];
let currentIndex = 0;

// ── Parser ────────────────────────────────────────────────

function parseDate(str) {
    const [m, d, y] = str.split('/').map(Number);
    return new Date(y, m - 1, d);
}

function parseList(text) {
    const result = [];
    for (const line of text.trim().split('\n')) {
        const t = line.trim();
        if (!t) continue;
        // {n}. {title} ({artistInfo}) [{date}] {{position}}
        const m = t.match(/^(\d+)\.\s+(.+?)\s+\((.+)\)\s+\[(\d+\/\d+\/\d+)\]\s+\{(\d+)\}$/);
        if (!m) continue;
        const [, , title, artistInfo, date, pos] = m;
        const artists = artistInfo.split(';;').map(s => {
            const segs = s.trim().split(', ');
            // segs: [name, ...personality words..., region]
            // personality has no commas, so: segs[0]=name, segs[last]=region, rest=personality
            const name        = segs[0];
            const region      = segs[segs.length - 1];
            const personality = segs.slice(1, -1).join(', ');
            return { name, personality, region };
        });
        result.push({
            title,
            artists,
            date,
            dateObj: parseDate(date),
            position: parseInt(pos),
        });
    }
    return result;
}

// ── Navigation ────────────────────────────────────────────

function startViewer() {
    const text = document.getElementById('paste-area').value;
    albums = parseList(text);
    if (albums.length === 0) {
        alert('No albums found. Make sure the text matches the expected format.');
        return;
    }
    currentIndex = 0;
    document.getElementById('input-view').style.display = 'none';
    document.getElementById('slideshow-view').style.display = 'flex';
    renderSlide();
}

function backToInput() {
    document.getElementById('slideshow-view').style.display = 'none';
    document.getElementById('input-view').style.display = 'flex';
}

function navigate(dir) {
    currentIndex = Math.max(0, Math.min(albums.length - 1, currentIndex + dir));
    renderSlide();
    document.getElementById('slide-content').scrollTop = 0;
}

document.addEventListener('keydown', e => {
    if (document.getElementById('slideshow-view').style.display === 'none') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
});

// ── Helpers ───────────────────────────────────────────────

function esc(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function entryHTML(album, highlightNames) {
    const others = album.artists.filter(a => !highlightNames || !highlightNames.has(a.name));
    const collabStr = others.length > 0
        ? ` <span class="entry-collab">w/ ${others.map(a => `${esc(a.name)} <span class="entry-meta">(${esc(a.personality)}, ${esc(a.region)})</span>`).join(', ')}</span>`
        : '';
    return `<div class="entry">
        <span class="entry-title">${esc(album.title)}</span>${collabStr}
        <span class="entry-meta"> [${esc(album.date)}] {${album.position}}</span>
    </div>`;
}

// ── Renderer ──────────────────────────────────────────────

function renderSlide() {
    const album   = albums[currentIndex];
    const upToNow = albums.slice(0, currentIndex + 1); // released up to and including now
    const before  = albums.slice(0, currentIndex);     // strictly before

    const isGroup    = album.artists.length > 1;
    const artistSet  = new Set(album.artists.map(a => a.name));

    // Nav bar
    document.getElementById('slide-counter').textContent =
        `${currentIndex + 1} / ${albums.length}`;
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === albums.length - 1;

    // ── Album header ──
    const chips = album.artists.map(a =>
        `<div class="chip">
            <span class="chip-name">${esc(a.name)}</span>
            <span class="chip-meta"> · ${esc(a.personality)} · ${esc(a.region)}</span>
        </div>`
    ).join('');

    const headerHTML = `
        <div id="album-header">
            <h1>#${album.position} — ${esc(album.title)}</h1>
            <div class="album-meta">Released ${esc(album.date)} · Chronological #${currentIndex + 1}</div>
            <div class="artist-chips">${chips}</div>
        </div>`;

    // ── Discographies ──
    let discoInner = '';
    for (const artist of album.artists) {
        const artistAlbums = upToNow.filter(a => a.artists.some(m => m.name === artist.name));
        discoInner += `<div class="sub-title">${esc(artist.name)} <span style="color:#666;font-weight:400;text-transform:none;letter-spacing:0">(${esc(artist.personality)}, ${esc(artist.region)})</span></div>`;
        discoInner += artistAlbums.length > 0
            ? artistAlbums.map(a => entryHTML(a, new Set([artist.name]))).join('')
            : `<div class="none-msg">No releases yet</div>`;
    }

    // ── Past collaborations (group only) ──
    let collabInner = '';
    if (isGroup) {
        const collabAlbums = before.filter(a => {
            const names = new Set(a.artists.map(m => m.name));
            let overlap = 0;
            for (const n of artistSet) if (names.has(n)) overlap++;
            return overlap >= 2;
        });
        if (collabAlbums.length > 0) {
            collabInner = collabAlbums.map(a => {
                const shared = a.artists
                    .filter(m => artistSet.has(m.name))
                    .map(m => esc(m.name)).join(', ');
                return `<div class="entry">
                    <span class="entry-title">${esc(a.title)}</span>
                    <span class="entry-collab"> (${shared})</span>
                    <span class="entry-meta"> [${esc(a.date)}] {${a.position}}</span>
                </div>`;
            }).join('');
        } else {
            collabInner = `<div class="none-msg">No previous collaborations between these artists</div>`;
        }
    }

    const discoSection = `
        <div class="section scrollable">
            <div class="section-title">Discographies</div>
            <div class="scroll-body">
                ${discoInner}
                ${isGroup ? `<div class="section-title" style="margin-top:1rem">Past Collaborations</div>${collabInner}` : ''}
            </div>
        </div>`;

    // ── Top 25 so far ──
    const top25 = [...upToNow].sort((a, b) => a.position - b.position).slice(0, 25);
    const top25Inner = top25.map((a, i) => {
        const artistStr = a.artists.map(m =>
            `${esc(m.name)} <span class="entry-meta">(${esc(m.personality)}, ${esc(m.region)})</span>`
        ).join(', ');
        return `<div class="entry">
            <span class="entry-rank">${i + 1}.</span>
            <span class="entry-title">${esc(a.title)}</span>
            <span class="entry-meta"> — </span>${artistStr}
            <span class="entry-meta"> {${a.position}}</span>
        </div>`;
    }).join('');

    const top25Section = `
        <div class="section scrollable">
            <div class="section-title">Top 25 So Far</div>
            <div class="scroll-body">${top25Inner}</div>
        </div>`;

    // ── Points leaderboard ──
    const pts = {};
    const artistData = {}; // name -> {personality, region}
    for (const a of upToNow) {
        const share = (250 - a.position) / a.artists.length;
        for (const m of a.artists) {
            pts[m.name] = (pts[m.name] || 0) + share;
            artistData[m.name] = { personality: m.personality, region: m.region };
        }
    }
    const ranked = Object.entries(pts).sort((a, b) => b[1] - a[1]);
    const ptsInner = `<div class="points-grid">` +
        ranked.map(([name, score], i) => {
            const info = artistData[name];
            return `<div class="points-row">
                <span>
                    <span class="entry-rank">${i + 1}.</span>
                    ${esc(name)}
                    <span class="entry-meta">(${esc(info.personality)}, ${esc(info.region)})</span>
                </span>
                <span class="points-val">${score.toFixed(1)}</span>
            </div>`;
        }).join('') +
    `</div>`;

    const ptsSection = `
        <div class="section full-width scrollable">
            <div class="section-title">Points Leaderboard</div>
            <div class="scroll-body">${ptsInner}</div>
        </div>`;

    document.getElementById('slide-content').innerHTML =
        headerHTML + discoSection + top25Section + ptsSection;
}
</script>
</body>
</html>
